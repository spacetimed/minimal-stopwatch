<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>break</title>
  <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" fill="black"/><circle cx="32" cy="32" r="10" fill="%23262626"/></svg>'>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap");

    :root {
      color-scheme: dark;
      --bg: #000;
      --fg: #f8f8f8;
      --muted: #8f8f8f;
      --dim: #4f4f4f;
      --line: #202020;
      --soft: rgba(255, 255, 255, 0.08);
      --active: #fff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: "DM Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    }

    body {
      overflow: hidden;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      opacity: 0.95;
    }

    main {
      position: relative;
      z-index: 1;
      display: grid;
      min-height: 100vh;
      place-items: center;
      padding: 28px;
    }

    .shell {
      display: grid;
      width: min(720px, 100%);
      gap: 18px;
      justify-items: center;
      text-align: center;
    }

    .state {
      color: var(--muted);
      font-size: clamp(12px, 1.6vw, 14px);
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .timer {
      font-size: clamp(54px, 13vw, 148px);
      font-weight: 500;
      line-height: 0.88;
      letter-spacing: 0;
      text-shadow: 0 0 28px rgba(255, 255, 255, 0.12);
      white-space: nowrap;
    }

    .subtimer {
      min-height: 20px;
      color: var(--muted);
      font-size: clamp(13px, 1.9vw, 16px);
      font-weight: 500;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    button {
      min-width: 104px;
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.03);
      color: var(--fg);
      font: inherit;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: border-color 160ms ease, background 160ms ease, transform 160ms ease;
    }

    button:hover {
      border-color: #6a6a6a;
      background: rgba(255, 255, 255, 0.08);
    }

    button:active {
      transform: translateY(1px);
    }

    button.primary {
      border-color: #f2f2f2;
      background: var(--fg);
      color: #000;
    }

    button.ghost {
      color: var(--muted);
    }

    button.complete {
      color: #d8d8d8;
    }

    .log {
      width: min(560px, 100%);
      max-height: 188px;
      overflow: auto;
      border-top: 1px solid var(--line);
      padding: 14px 14px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
      text-align: left;
      scrollbar-gutter: stable;
      scrollbar-color: #444 #050505;
    }

    .entry {
      display: grid;
      grid-template-columns: minmax(0, max-content) minmax(90px, 1fr) 18px;
      gap: 10px;
      align-items: start;
      padding: 1px 0;
    }

    .entry.current .range {
      color: var(--fg);
    }

    .range {
      white-space: nowrap;
    }

    .note {
      display: block;
      width: 100%;
      min-width: 0;
      min-height: 20px;
      max-height: 120px;
      border: 0;
      border-bottom: 1px solid transparent;
      padding: 0;
      background: transparent;
      color: #c8c8c8;
      font: inherit;
      line-height: 1.6;
      outline: none;
      overflow: hidden;
      resize: none;
    }

    .note::placeholder {
      color: var(--dim);
    }

    .note:focus {
      border-bottom-color: #555;
    }

    .delete-entry {
      display: grid;
      width: 16px;
      min-width: 0;
      height: 18px;
      place-items: center;
      border: 0;
      padding: 0;
      background: transparent;
      color: #3f3f3f;
      font-size: 13px;
      line-height: 1;
      opacity: 0;
    }

    .entry:hover .delete-entry,
    .delete-entry:focus {
      opacity: 1;
    }

    .delete-entry:hover {
      color: #dedede;
      background: transparent;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      color: var(--dim);
      font-size: 11px;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 4;
      display: grid;
      place-items: center;
      padding: 22px;
      background: rgba(0, 0, 0, 0.72);
      opacity: 1;
    }

    .modal-backdrop.hidden {
      display: none;
    }

    .complete-modal {
      position: relative;
      z-index: 1;
      width: min(620px, 100%);
      max-height: min(680px, calc(100vh - 44px));
      overflow: auto;
      border: 1px solid #242424;
      border-radius: 6px;
      padding: 28px;
      background: rgba(5, 5, 5, 0.96);
      box-shadow: 0 0 80px rgba(255, 255, 255, 0.08);
      text-align: left;
    }

    .modal-close {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 22px;
      min-width: 0;
      height: 22px;
      border: 0;
      padding: 0;
      background: transparent;
      color: #696969;
      line-height: 1;
    }

    .modal-close:hover {
      color: var(--fg);
      background: transparent;
    }

    .complete-kicker {
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .complete-title {
      margin: 10px 0 6px;
      color: var(--fg);
      font-size: clamp(26px, 6vw, 44px);
      font-weight: 500;
      line-height: 1;
    }

    .complete-summary {
      margin: 0 0 20px;
      color: #bdbdbd;
      font-size: 13px;
      line-height: 1.7;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      margin: 18px 0 22px;
    }

    .summary-stat {
      border: 1px solid #202020;
      border-radius: 4px;
      padding: 10px;
      background: rgba(255, 255, 255, 0.025);
    }

    .summary-label {
      color: var(--dim);
      font-size: 10px;
      text-transform: uppercase;
    }

    .summary-value {
      margin-top: 5px;
      color: var(--fg);
      font-size: 14px;
    }

    .timeline-wrap {
      margin-top: 10px;
    }

    .timeline-labels {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
      color: var(--dim);
      font-size: 10px;
    }

    .timeline {
      position: relative;
      height: 28px;
      overflow: hidden;
      border: 1px solid #242424;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.035);
    }

    .timeline-segment {
      position: absolute;
      top: 0;
      bottom: 0;
      min-width: 2px;
    }

    .timeline-segment.shift {
      background: #4ade80;
    }

    .timeline-segment.break {
      background: #f59e0b;
    }

    .timeline-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 10px;
      color: var(--muted);
      font-size: 11px;
    }

    .legend-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      margin-right: 6px;
      border-radius: 50%;
    }

    .legend-dot.shift {
      background: #4ade80;
    }

    .legend-dot.break {
      background: #f59e0b;
    }

    .notes-summary {
      margin-top: 20px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
      white-space: pre-wrap;
    }

    .confetti-layer {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .confetti-piece {
      position: absolute;
      top: -16px;
      width: 7px;
      height: 12px;
      border-radius: 1px;
      animation: confetti-fall 1200ms cubic-bezier(0.2, 0.8, 0.35, 1) forwards;
    }

    @keyframes confetti-fall {
      to {
        transform: translate3d(var(--dx), 112vh, 0) rotate(720deg);
        opacity: 0;
      }
    }

    .hidden {
      display: none;
    }

    @media (max-width: 560px) {
      main {
        padding: 18px;
      }

      .timer {
        font-size: clamp(46px, 17vw, 74px);
      }

      .entry {
        grid-template-columns: minmax(0, 1fr) 18px;
        gap: 0 8px;
      }

      .range,
      .note {
        grid-column: 1;
      }

      .delete-entry {
        grid-column: 2;
        grid-row: 1 / span 2;
      }

      button {
        min-width: 96px;
      }

      .complete-modal {
        padding: 24px 18px;
      }

      .summary-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
  </style>
</head>
<body>
  <canvas id="particles" aria-hidden="true"></canvas>
  <main>
    <section class="shell" aria-label="Shift timer">
      <div class="state" id="stateLabel">break</div>
      <div class="timer" id="timer">00:00:00</div>
      <div class="subtimer" id="subtimer">ready</div>
      <div class="controls">
        <button class="primary" id="beginButton" type="button">begin</button>
        <button id="breakButton" type="button">break</button>
        <button class="complete" id="completeButton" type="button">complete 🚀</button>
        <button class="ghost" id="resetButton" type="button">reset</button>
      </div>
      <div class="log" id="log" aria-label="Shift log"></div>
      <div class="meta">
        <span id="shiftTotal">shift total 00:00</span>
        <span id="breakTotal">break total 00:00</span>
      </div>
    </section>
  </main>
  <div class="modal-backdrop hidden" id="completeBackdrop" role="dialog" aria-modal="true" aria-labelledby="completeTitle">
    <div class="confetti-layer" id="confettiLayer" aria-hidden="true"></div>
    <section class="complete-modal">
      <button class="modal-close" id="completeClose" type="button" aria-label="close summary">x</button>
      <div class="complete-kicker">day complete</div>
      <h1 class="complete-title" id="completeTitle">congratulations! 🚀</h1>
      <p class="complete-summary" id="completeSummary"></p>
      <div class="summary-grid" id="summaryGrid"></div>
      <div class="timeline-wrap">
        <div class="timeline-labels">
          <span id="timelineStart">--:--</span>
          <span id="timelineEnd">--:--</span>
        </div>
        <div class="timeline" id="timeline"></div>
        <div class="timeline-legend">
          <span><i class="legend-dot shift"></i>work</span>
          <span><i class="legend-dot break"></i>break</span>
        </div>
      </div>
      <div class="notes-summary" id="notesSummary"></div>
    </section>
  </div>

  <script>
    const STORAGE_KEY = "basic-shift-timer-v1";
    const beginButton = document.querySelector("#beginButton");
    const breakButton = document.querySelector("#breakButton");
    const completeButton = document.querySelector("#completeButton");
    const resetButton = document.querySelector("#resetButton");
    const timer = document.querySelector("#timer");
    const subtimer = document.querySelector("#subtimer");
    const stateLabel = document.querySelector("#stateLabel");
    const log = document.querySelector("#log");
    const shiftTotal = document.querySelector("#shiftTotal");
    const breakTotal = document.querySelector("#breakTotal");
    const completeBackdrop = document.querySelector("#completeBackdrop");
    const completeClose = document.querySelector("#completeClose");
    const completeSummary = document.querySelector("#completeSummary");
    const summaryGrid = document.querySelector("#summaryGrid");
    const timeline = document.querySelector("#timeline");
    const timelineStart = document.querySelector("#timelineStart");
    const timelineEnd = document.querySelector("#timelineEnd");
    const notesSummary = document.querySelector("#notesSummary");
    const confettiLayer = document.querySelector("#confettiLayer");

    const defaultState = {
      mode: "break",
      activeId: null,
      events: [],
      counts: { shift: 0, break: 0 }
    };

    let state = loadState();
    normalizeCounts();

    function loadState() {
      try {
        return { ...defaultState, ...JSON.parse(localStorage.getItem(STORAGE_KEY)) };
      } catch {
        return structuredClone(defaultState);
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function normalizeCounts() {
      const counts = { shift: 0, break: 0 };
      for (const event of state.events) {
        counts[event.type] += 1;
        event.index = counts[event.type];
      }
      state.counts = counts;
      if (!activeEvent()) {
        state.activeId = null;
      }
    }

    function now() {
      return Date.now();
    }

    function clock(ts) {
      return new Date(ts).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hour12: false });
    }

    function duration(ms, withSeconds = false) {
      const total = Math.max(0, Math.floor(ms / 1000));
      const hours = Math.floor(total / 3600);
      const minutes = Math.floor((total % 3600) / 60);
      const seconds = total % 60;
      const two = (value) => String(value).padStart(2, "0");

      if (withSeconds) {
        return `${two(hours)}:${two(minutes)}:${two(seconds)}`;
      }

      return `${two(hours)}:${two(minutes)}`;
    }

    function titleDuration(ms) {
      const totalMinutes = Math.max(0, Math.floor(ms / 60000));
      const hours = Math.floor(totalMinutes / 60);
      const minutes = totalMinutes % 60;
      return hours > 0 ? `${hours}:${String(minutes).padStart(2, "0")}h` : `${minutes}m`;
    }

    function activeEvent() {
      return state.events.find((event) => event.id === state.activeId) || null;
    }

    function beginWork() {
      const current = activeEvent();
      if (current) {
        current.end = now();
      }

      state.counts.shift += 1;
      const id = crypto.randomUUID();
      state.mode = "working";
      state.activeId = id;
      state.events.push({
        id,
        type: "shift",
        index: state.counts.shift,
        start: now(),
        end: null,
        note: ""
      });
      saveState();
      render(true);
    }

    function beginBreak() {
      const current = activeEvent();
      if (current) {
        current.end = now();
      }

      state.counts.break += 1;
      const id = crypto.randomUUID();
      state.mode = "break";
      state.activeId = id;
      state.events.push({
        id,
        type: "break",
        index: state.counts.break,
        start: now(),
        end: null,
        note: ""
      });
      saveState();
      render(true);
    }

    function resetAll() {
      if (!confirm("reset timer log?")) {
        return;
      }

      state = structuredClone(defaultState);
      saveState();
      render(true);
    }

    function deleteEvent(id) {
      const deletedActive = state.activeId === id;
      state.events = state.events.filter((event) => event.id !== id);
      if (deletedActive) {
        state.mode = "break";
        state.activeId = null;
      }
      normalizeCounts();
      saveState();
      render(true);
    }

    function completeDay() {
      const current = activeEvent();
      if (current) {
        current.end = now();
      }
      state.mode = "complete";
      state.activeId = null;
      saveState();
      render(true);
      renderCompleteSummary();
      showCompleteModal();
      launchConfetti();
    }

    function eventMs(event, at = now()) {
      return (event.end || at) - event.start;
    }

    function sum(type) {
      const at = now();
      return state.events
        .filter((event) => event.type === type)
        .reduce((total, event) => total + eventMs(event, at), 0);
    }

    function summaryStats() {
      const finishedEvents = state.events.filter((event) => event.start && (event.end || state.activeId === event.id));
      const first = finishedEvents[0];
      const last = finishedEvents[finishedEvents.length - 1];
      const start = first?.start || null;
      const end = last ? (last.end || now()) : null;
      const shiftMs = sum("shift");
      const breakMs = sum("break");
      const shiftCount = state.events.filter((event) => event.type === "shift").length;
      const breakCount = state.events.filter((event) => event.type === "break").length;

      return {
        start,
        end,
        shiftMs,
        breakMs,
        totalMs: shiftMs + breakMs,
        spanMs: start && end ? end - start : 0,
        shiftCount,
        breakCount
      };
    }

    function renderCompleteSummary() {
      const stats = summaryStats();
      const hasEvents = state.events.length > 0;
      completeSummary.textContent = hasEvents
        ? `You moved through ${stats.shiftCount} work block${stats.shiftCount === 1 ? "" : "s"} and ${stats.breakCount} break${stats.breakCount === 1 ? "" : "s"}, from ${clock(stats.start)} to ${clock(stats.end)}.`
        : "Nothing logged yet, but opening the finish screen still counts as a tiny ceremony.";

      summaryGrid.innerHTML = "";
      for (const stat of [
        ["work", duration(stats.shiftMs, true)],
        ["break", duration(stats.breakMs, true)],
        ["span", duration(stats.spanMs, true)],
        ["blocks", `${stats.shiftCount}/${stats.breakCount}`]
      ]) {
        const card = document.createElement("div");
        card.className = "summary-stat";

        const label = document.createElement("div");
        label.className = "summary-label";
        label.textContent = stat[0];

        const value = document.createElement("div");
        value.className = "summary-value";
        value.textContent = stat[1];

        card.append(label, value);
        summaryGrid.append(card);
      }

      renderTimeline(stats);
      renderNotesSummary();
    }

    function renderTimeline(stats) {
      timeline.innerHTML = "";
      timelineStart.textContent = stats.start ? clock(stats.start) : "--:--";
      timelineEnd.textContent = stats.end ? clock(stats.end) : "--:--";

      if (!stats.start || !stats.end || stats.spanMs <= 0) {
        return;
      }

      for (const event of state.events) {
        const eventEnd = event.end || stats.end;
        const left = ((event.start - stats.start) / stats.spanMs) * 100;
        const width = Math.max(((eventEnd - event.start) / stats.spanMs) * 100, 0.8);
        const segment = document.createElement("div");
        segment.className = `timeline-segment ${event.type}`;
        segment.style.left = `${Math.max(0, Math.min(left, 100))}%`;
        segment.style.width = `${Math.min(width, 100)}%`;
        segment.title = `${event.type} ${event.index}: ${clock(event.start)} - ${clock(eventEnd)}`;
        timeline.append(segment);
      }
    }

    function renderNotesSummary() {
      const notes = state.events
        .filter((event) => event.note?.trim())
        .map((event) => `${event.type} ${event.index}: ${event.note.trim()}`);

      notesSummary.textContent = notes.length ? notes.join("\n") : "no notes today";
    }

    function showCompleteModal() {
      completeBackdrop.classList.remove("hidden");
      completeClose.focus();
    }

    function hideCompleteModal() {
      completeBackdrop.classList.add("hidden");
    }

    function launchConfetti() {
      const colors = ["#4ade80", "#f59e0b", "#f8f8f8", "#60a5fa", "#f472b6"];
      confettiLayer.innerHTML = "";

      for (let i = 0; i < 90; i += 1) {
        const piece = document.createElement("span");
        piece.className = "confetti-piece";
        piece.style.left = `${Math.random() * 100}%`;
        piece.style.background = colors[Math.floor(Math.random() * colors.length)];
        piece.style.animationDelay = `${Math.random() * 260}ms`;
        piece.style.animationDuration = `${900 + Math.random() * 900}ms`;
        piece.style.setProperty("--dx", `${(Math.random() - 0.5) * 180}px`);
        confettiLayer.append(piece);
      }

      setTimeout(() => {
        confettiLayer.innerHTML = "";
      }, 2200);
    }

    function render(forceLog = false) {
      const current = activeEvent();
      const at = now();
      const isWorking = current?.type === "shift" && !current.end;
      const isBreaking = current?.type === "break" && !current.end;

      stateLabel.textContent = isWorking ? `shift ${current.index}` : "break";
      timer.textContent = current ? duration(eventMs(current, at), true) : "00:00:00";
      subtimer.textContent = current
        ? `${clock(current.start)} - now (${current.type} ${current.index})`
        : "ready";

      beginButton.textContent = isBreaking ? "continue" : "begin";
      beginButton.classList.toggle("primary", !isWorking);
      breakButton.classList.toggle("primary", isWorking);
      breakButton.disabled = !isWorking;

      shiftTotal.textContent = `shift total ${duration(sum("shift"))}`;
      breakTotal.textContent = `break total ${duration(sum("break"))}`;

      if (forceLog) {
        renderLog();
      } else {
        updateLogRanges();
      }

      if (isWorking) {
        document.title = `working ${titleDuration(eventMs(current, at))}`;
      } else if (isBreaking && state.events.length > 0) {
        document.title = `break ${titleDuration(eventMs(current, at))}`;
      } else {
        document.title = "break";
      }
    }

    function renderLog() {
      const at = now();
      log.innerHTML = "";
      if (state.events.length === 0) {
        const empty = document.createElement("div");
        empty.textContent = "no entries yet";
        log.append(empty);
        return;
      }

      for (const event of state.events) {
        const row = document.createElement("div");
        const isCurrent = !event.end;
        row.className = `entry${isCurrent ? " current" : ""}`;

        const range = document.createElement("span");
        range.className = "range";
        range.dataset.eventId = event.id;
        range.textContent = `${clock(event.start)} - ${event.end ? clock(event.end) : "now"} (${event.type} ${event.index})`;

        const note = document.createElement("textarea");
        note.className = "note";
        note.value = event.note || "";
        note.placeholder = isCurrent && event.type === "shift" ? "[notes...]" : "";
        note.ariaLabel = `${event.type} ${event.index} notes`;
        note.addEventListener("input", () => {
          event.note = note.value;
          syncNoteHeight(note);
          saveState();
        });
        note.addEventListener("keydown", (keyEvent) => {
          if (keyEvent.key === "Enter" && !keyEvent.shiftKey) {
            keyEvent.preventDefault();
            note.blur();
          }
        });

        const deleteButton = document.createElement("button");
        deleteButton.className = "delete-entry";
        deleteButton.type = "button";
        deleteButton.textContent = "x";
        deleteButton.title = `delete ${event.type} ${event.index}`;
        deleteButton.ariaLabel = `delete ${event.type} ${event.index}`;
        deleteButton.addEventListener("click", () => deleteEvent(event.id));

        row.append(range, note, deleteButton);
        log.append(row);
        syncNoteHeight(note);
      }

      log.scrollTop = log.scrollHeight;
    }

    function syncNoteHeight(note) {
      note.style.height = "auto";
      note.style.height = `${note.scrollHeight}px`;
    }

    function updateLogRanges() {
      if (state.events.length === 0 || log.children.length !== state.events.length) {
        renderLog();
        return;
      }

      for (const event of state.events) {
        const range = log.querySelector(`.range[data-event-id="${event.id}"]`);
        if (range) {
          range.textContent = `${clock(event.start)} - ${event.end ? clock(event.end) : "now"} (${event.type} ${event.index})`;
        }
      }
    }

    beginButton.addEventListener("click", beginWork);
    breakButton.addEventListener("click", beginBreak);
    completeButton.addEventListener("click", completeDay);
    resetButton.addEventListener("click", resetAll);
    completeClose.addEventListener("click", hideCompleteModal);
    completeBackdrop.addEventListener("click", (event) => {
      if (event.target === completeBackdrop) {
        hideCompleteModal();
      }
    });
    window.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        hideCompleteModal();
      }
    });
    window.addEventListener("beforeunload", (event) => {
      event.preventDefault();
      event.returnValue = "";
    });

    setInterval(render, 1000);
    render(true);

    const canvas = document.querySelector("#particles");
    const ctx = canvas.getContext("2d");
    let particles = [];
    let width = 0;
    let height = 0;
    let pixelRatio = 1;

    function resizeParticles() {
      pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = Math.floor(width * pixelRatio);
      canvas.height = Math.floor(height * pixelRatio);
      canvas.style.width = `${width}px`;
      canvas.style.height = `${height}px`;
      ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);

      const count = Math.min(180, Math.max(70, Math.floor((width * height) / 9000)));
      particles = Array.from({ length: count }, () => ({
        x: Math.random() * width,
        y: Math.random() * height,
        r: Math.random() * 0.75 + 0.35,
        vx: (Math.random() - 0.5) * 0.22,
        vy: (Math.random() - 0.5) * 0.22,
        a: Math.random() * 0.55 + 0.32,
        twinkle: Math.random() * Math.PI * 2,
        twinkleSpeed: Math.random() * 0.035 + 0.012,
        glow: Math.random() > 0.82
      }));
    }

    function drawParticles() {
      ctx.clearRect(0, 0, width, height);
      for (const p of particles) {
        p.x += p.vx;
        p.y += p.vy;

        if (p.x < -10) p.x = width + 10;
        if (p.x > width + 10) p.x = -10;
        if (p.y < -10) p.y = height + 10;
        if (p.y > height + 10) p.y = -10;

        p.twinkle += p.twinkleSpeed;
        const alpha = Math.min(1, Math.max(0.22, p.a + Math.sin(p.twinkle) * 0.2));

        if (p.glow) {
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r * 2.2, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255,255,255,${alpha * 0.16})`;
          ctx.fill();
        }

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,255,255,${alpha})`;
        ctx.fill();
      }

      requestAnimationFrame(drawParticles);
    }

    window.addEventListener("resize", resizeParticles);
    resizeParticles();
    drawParticles();
  </script>
</body>
</html>
